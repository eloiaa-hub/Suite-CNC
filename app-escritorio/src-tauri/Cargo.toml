[package]
name = "simulador-3d"
version = "0.1.0"
description = "Suite CNC — versión de escritorio (la Suite y cada programa por separado)"
authors = ["Eloi A.A."]
license = "EUPL-1.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# F12 / herramientas de desarrollador (ediciones con "devtools": true en ediciones.json)
devtools = ["tauri/devtools"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

# Ejecutable pequeño y rápido en la versión final
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
